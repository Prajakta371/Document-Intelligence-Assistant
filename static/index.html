<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Intelligence Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6f8b'/%3E%3Cpath d='M18 12h20l10 10v30a2 2 0 0 1-2 2H18a2 2 0 0 1-2-2V14a2 2 0 0 1 2-2z' fill='%23fff'/%3E%3Cpath d='M38 12v10h10z' fill='%239cc9d9'/%3E%3Crect x='22' y='30' width='20' height='3' rx='1.5' fill='%231f6f8b'/%3E%3Crect x='22' y='38' width='14' height='3' rx='1.5' fill='%231f6f8b'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1d2733;
    --muted: #5f6b7a;
    --line: #dfe5ec;
    --accent: #1f6f8b;
    --accent-dark: #17566d;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .subtitle { margin: 0 0 24px; color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  h2 { margin: 0 0 12px; font-size: 1.05rem; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text] {
    flex: 1 1 260px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 1rem;
  }
  input[type=file] { flex: 1 1 260px; font-size: 0.95rem; }
  button {
    padding: 10px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-dark); }
  button:disabled { opacity: 0.55; cursor: default; }
  button.link {
    background: none;
    color: var(--danger);
    padding: 4px 8px;
    font-size: 0.85rem;
  }
  button.link:hover:not(:disabled) { background: #fbeceb; }
  ul { list-style: none; margin: 12px 0 0; padding: 0; }
  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-top: 1px solid var(--line);
  }
  li small { color: var(--muted); }
  .status { margin: 10px 0 0; min-height: 1.2em; font-size: 0.9rem; color: var(--muted); }
  .status.error { color: var(--danger); }
  .answer { white-space: pre-wrap; }
  .cite {
    display: inline-block;
    min-width: 1.3em;
    padding: 0 5px;
    margin: 0 2px;
    border-radius: 6px;
    background: #dcecf2;
    color: var(--accent-dark);
    font-size: 0.78rem;
    font-weight: 600;
    text-align: center;
    vertical-align: super;
  }
  details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: var(--accent-dark); font-weight: 600; }
  .source { margin-top: 12px; }
  .source .meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  .source .text {
    background: var(--bg);
    border-left: 3px solid var(--accent);
    padding: 8px 12px;
    font-size: 0.9rem;
    border-radius: 0 6px 6px 0;
  }
  .stats { margin-top: 12px; font-size: 0.8rem; color: var(--muted); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Document Intelligence Assistant</h1>
  <p class="subtitle">Upload a document, then ask questions. Answers come only from your documents, with citations.</p>

  <section class="card">
    <h2>1. Your documents</h2>
    <div class="row">
      <input type="file" id="file" accept=".pdf,.txt,.md">
      <button id="uploadBtn">Upload</button>
    </div>
    <p class="status" id="uploadStatus"></p>
    <ul id="docList"></ul>
    <p class="status" id="emptyDocs">No documents yet. Upload a PDF, .txt or .md file to begin.</p>
  </section>

  <section class="card">
    <h2>2. Ask a question</h2>
    <div class="row">
      <input type="text" id="question" placeholder="e.g. How long is a mortgage pre-approval valid?">
      <button id="askBtn">Ask</button>
    </div>
    <p class="status" id="askStatus"></p>
  </section>

  <section class="card hidden" id="answerCard">
    <h2>Answer</h2>
    <div class="answer" id="answer"></div>
    <details id="sourcesBox">
      <summary>Sources used</summary>
      <div id="sources"></div>
    </details>
    <div class="stats" id="stats"></div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);

  // Calls the backend and turns error responses into readable messages.
  async function api(path, options) {
    const res = await fetch(path, options);
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail || detail; } catch (e) {}
      throw new Error(detail);
    }
    return res.json();
  }

  function setStatus(id, message, isError) {
    const el = $(id);
    el.textContent = message || "";
    el.className = "status" + (isError ? " error" : "");
  }

  async function loadDocs() {
    const docs = await api("/documents");
    const list = $("docList");
    list.innerHTML = "";
    $("emptyDocs").classList.toggle("hidden", docs.length > 0);
    docs.forEach((doc) => {
      const li = document.createElement("li");
      const label = document.createElement("span");
      label.textContent = doc.name + " ";
      const small = document.createElement("small");
      small.textContent = "(" + doc.chunks + " chunks)";
      label.appendChild(small);
      const del = document.createElement("button");
      del.className = "link";
      del.textContent = "Delete";
      del.onclick = async () => {
        del.disabled = true;
        try {
          await api("/documents/" + doc.doc_id, { method: "DELETE" });
          await loadDocs();
        } catch (e) {
          setStatus("uploadStatus", e.message, true);
          del.disabled = false;
        }
      };
      li.appendChild(label);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  $("uploadBtn").onclick = async () => {
    const file = $("file").files[0];
    if (!file) { setStatus("uploadStatus", "Choose a file first.", true); return; }
    const form = new FormData();
    form.append("file", file);
    $("uploadBtn").disabled = true;
    setStatus("uploadStatus", "Uploading and indexing...");
    try {
      const result = await api("/documents", { method: "POST", body: form });
      setStatus("uploadStatus", "Added " + result.name + " (" + result.chunks + " chunks).");
      $("file").value = "";
      await loadDocs();
    } catch (e) {
      setStatus("uploadStatus", e.message, true);
    } finally {
      $("uploadBtn").disabled = false;
    }
  };

  // Show the answer as plain text, turning [1] markers into small badges.
  function renderAnswer(text) {
    const box = $("answer");
    box.innerHTML = "";
    text.split(/(\[\d+\])/).forEach((part) => {
      if (/^\[\d+\]$/.test(part)) {
        const badge = document.createElement("span");
        badge.className = "cite";
        badge.textContent = part.slice(1, -1);
        box.appendChild(badge);
      } else {
        box.appendChild(document.createTextNode(part));
      }
    });
  }

  function renderSources(sources) {
    const box = $("sources");
    box.innerHTML = "";
    sources.forEach((s) => {
      const wrap = document.createElement("div");
      wrap.className = "source";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "[" + s.n + "] " + s.doc_name + ", chunk " + s.chunk_no;
      const text = document.createElement("div");
      text.className = "text";
      text.textContent = s.text;
      wrap.appendChild(meta);
      wrap.appendChild(text);
      box.appendChild(wrap);
    });
    $("sourcesBox").classList.toggle("hidden", sources.length === 0);
  }

  async function ask() {
    const question = $("question").value.trim();
    if (!question) { setStatus("askStatus", "Type a question first.", true); return; }
    $("askBtn").disabled = true;
    setStatus("askStatus", "Searching your documents and asking Claude...");
    try {
      const result = await api("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question, k: 3 }),
      });
      renderAnswer(result.answer);
      renderSources(result.sources || []);
      $("stats").textContent = result.latency_s !== undefined
        ? "Response time " + result.latency_s + "s | " + result.input_tokens + " input tokens, " + result.output_tokens + " output tokens"
        : "";
      $("answerCard").classList.remove("hidden");
      setStatus("askStatus", "");
    } catch (e) {
      setStatus("askStatus", e.message, true);
    } finally {
      $("askBtn").disabled = false;
    }
  }

  $("askBtn").onclick = ask;
  $("question").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });

  loadDocs().catch((e) => setStatus("uploadStatus", e.message, true));
</script>
</body>
</html>
